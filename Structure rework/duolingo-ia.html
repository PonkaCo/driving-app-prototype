<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Duolingo-style IA — Structure rework</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --brand:#401971;--brand2:#6B2ABC;--accent:#FA5732;
  --brand-grad:linear-gradient(151.6deg,#411A72 14%,#6D2BC0 90%);
  --bg:#F2F0F5;--bg2:#E9E7EB;--card:#FCFCFC;
  --text:#150826;--muted:#797282;
  --on-brand:#FFFCFC;--on-brand2:#CFBBE2;
  --success:#00A850;--success-bg:#D4FCE7;
  --error:#FF2346;--error-bg:#FFE0E5;
  --warning:#FFED28;--warn-star:#FAC32A;--warn-bg:#FFFBD4;
  --shadow:0px 6px 30px 0px rgba(55,22,97,0.08);
  --shadow-top:0px -2px 24px 0px rgba(55,21,97,0.04);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
body{background:#1A1230;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.phone{
  width:390px;height:844px;border-radius:50px;overflow:hidden;flex-shrink:0;position:relative;
  box-shadow:0 0 0 10px #1A1A2E,0 0 0 12px #2E2E50,0 48px 100px rgba(0,0,0,.6);
  display:flex;flex-direction:column;background:var(--card);
}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{display:none;}

/* ── sticky top: statusbar + header + hero ── */
.sticky-top{position:sticky;top:0;z-index:6;background:var(--card);}
.sbar{height:46px;padding:14px 22px 0;display:flex;align-items:center;justify-content:space-between;}
.sbar .time{font-size:15px;font-weight:700;color:var(--text);}
.sbar .icons{display:flex;align-items:center;gap:5px;color:var(--text);}
.sbar .icons svg{width:16px;height:16px;}

.home-head{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 12px;}
.coin-pill{
  display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bg2);
  border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--text);box-shadow:var(--shadow);
}
.coin-pill svg{width:15px;height:15px;color:var(--warn-star);}
.head-icons{display:flex;gap:10px;}
.circ-btn{
  width:38px;height:38px;border-radius:999px;border:1px solid var(--bg2);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);
}
.circ-btn svg{width:17px;height:17px;color:var(--muted);}
.circ-btn.fav svg{color:var(--warn-star);}

/* ── top card: sticky, swipeable (Theory topic / Exam / Learning modes) ──
   Theory = small bordered pill, centered text. Exam/Modes = big tinted card, icon on top. */
.hero-wrap{padding:0 20px 14px;touch-action:pan-y;}
.hero-card{
  border:2px solid var(--brand);border-radius:20px;padding:14px 16px;position:relative;
  display:flex;flex-direction:column;align-items:center;text-align:center;cursor:grab;user-select:none;
  background:var(--card);
}
.hero-card .hero-icon{display:none;width:68px;height:68px;border-radius:20px;background:#fff;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 6px 16px rgba(55,22,97,.06);}
.hero-card .hero-icon svg{width:30px;height:30px;}
.hero-card .hero-sub{display:none;font-size:13px;color:var(--muted);margin-top:4px;}
/* big variant — Exam / Learning modes slides get the icon+title+subtitle card back */
.hero-card.big{border:none;background:#F0EAF8;border-radius:28px;padding:22px 16px 20px;}
.hero-card.big .hero-icon{display:flex;}
.hero-card.big .hero-sub{display:block;}
.hero-card.big .tb-lvl{display:none;}
.hero-card.big .tb-ttl{font-size:21px;}
@keyframes swipeHint{0%,100%{transform:translateX(0);}25%{transform:translateX(-22px);}50%{transform:translateX(4px);}70%{transform:translateX(-8px);}85%{transform:translateX(2px);}}
.hero-card.hint{animation:swipeHint .9s ease-in-out;}
/* floating nav arrows — hover over the bottom of the screen, above the tab bar, not tied to the card */
.hero-arrow-float{
  position:absolute;bottom:96px;width:36px;height:36px;border-radius:999px;z-index:7;
  border:none;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--shadow);
}
.hero-arrow-float.left{left:16px;}
.hero-arrow-float.right{right:16px;}
.hero-arrow-float svg{width:16px;height:16px;color:var(--muted);}
.hero-arrow-float.hidden{display:none;}

/* ── content panel ── */
.content-panel{padding:18px 20px 32px;}

.banner-sticky{position:sticky;z-index:5;background:var(--card);padding:24px 20px 10px;display:none;}
.tabs-sticky{position:sticky;z-index:5;background:var(--card);padding:24px 20px 12px;display:none;}
.topic-banner{border:2px solid var(--brand);border-radius:20px;padding:14px 16px;text-align:center;background:var(--card);}
.tb-lvl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--brand);text-transform:uppercase;margin-bottom:4px;}
.tb-ttl{font-size:17px;font-weight:800;color:var(--text);}

/* ── path ── */
.path-box{position:relative;margin:0 auto;}
.pnode-wrap{position:absolute;display:flex;align-items:center;gap:14px;transform:translate(-50%,-50%);}
.pnode{width:56px;height:56px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;cursor:pointer;border:none;position:relative;}
.pnode-inner svg{width:22px;height:22px;}
.pnode.done{background:var(--success);color:#fff;}
.pnode.current{background:var(--brand);color:#fff;}
.pnode.todo{background:var(--bg2);color:#A79FB0;}
.pnode.mistake{background:var(--error-bg);color:var(--error);}
.pnode.failed{background:var(--error-bg);color:var(--error);}
.pcap{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;}
.pcap.dim{color:#B7B0C2;}
.path-collapse{width:38px;height:38px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:8px 0 0;}
.path-collapse svg{width:18px;height:18px;color:var(--muted);}
.plain-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6;}

/* ── hazard grid (used inside Learning modes > Hazard perception) ── */
.pill-tabs{display:flex;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:16px;}
.pill-tab{flex:1;border:none;background:transparent;border-radius:999px;padding:9px 0;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;}
.pill-tab.active{background:#fff;color:var(--brand);box-shadow:0 1px 6px rgba(55,22,97,.10);}
.hz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hz-card{border-radius:16px;overflow:hidden;border:1px solid var(--bg2);}
.hz-card.current{border:2px solid var(--brand);}
.hz-thumb{height:78px;position:relative;background:var(--bg);overflow:hidden;}
.hz-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.hz-badge{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:999px;box-shadow:0 0 0 2px #fff;}
.hz-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;}
.hz-num{font-size:13px;font-weight:700;color:var(--muted);}
.hz-status{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;}
.hz-status.start{color:var(--brand2);}
.hz-dot{width:8px;height:8px;border-radius:999px;flex-shrink:0;}

/* ── exam ── */
.stat-row{display:flex;gap:10px;margin-bottom:18px;}
.stat-box{flex:1;background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);}
.stat-box .v{font-size:16px;font-weight:800;color:var(--text);}
.stat-box .l{font-size:11px;color:var(--muted);margin-top:2px;}
.pass-lbl{font-size:12px;color:var(--muted);margin-bottom:6px;}
.pass-bar{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-bottom:22px;}
.pass-bar-fill{height:100%;background:var(--success);border-radius:999px;}

/* ── learning modes list ── */
.lm-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--bg2);background:var(--card);margin-bottom:10px;cursor:pointer;}
.lm-ico{width:42px;height:42px;border-radius:12px;background:#E1D4F2;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lm-ico svg{width:20px;height:20px;color:var(--brand2);}
.lm-txt{flex:1;min-width:0;}
.lm-ttl{font-size:15px;font-weight:700;color:var(--text);}
.lm-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.lm-start{font-size:13px;font-weight:700;color:var(--brand2);white-space:nowrap;display:flex;align-items:center;}
.lm-start svg{width:18px;height:18px;color:var(--muted);}
.lm-back{display:flex;align-items:center;gap:8px;margin-bottom:16px;cursor:pointer;}
.lm-back svg{width:18px;height:18px;color:var(--muted);}
.lm-back span{font-size:14px;font-weight:600;color:var(--muted);}

/* buttons — from ui-kit Primary/Secondary M */
.btn-full{width:100%;height:44px;border:none;border-radius:24px;background:var(--accent);color:var(--on-brand);font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-full svg{width:16px;height:16px;}

/* bottom sheet */
.bs-overlay{display:none;position:absolute;inset:0;z-index:10;background:rgba(21,8,38,.45);opacity:0;transition:opacity .3s;}
.bs-overlay.vis{opacity:1;}
.bs{display:none;position:absolute;bottom:0;left:0;right:0;z-index:11;background:#fff;border-radius:24px 24px 0 0;padding:12px 20px 32px;transform:translateY(100%);transition:transform .38s cubic-bezier(.4,0,.2,1);}
.bs.open{transform:translateY(0);}
.bs-handle{width:36px;height:4px;background:#DEDBE1;border-radius:2px;margin:0 auto 18px;}
.bs-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:8px;text-align:center;}
.bs-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:20px;}
.bs-btns{display:flex;flex-direction:column;gap:8px;}
.bs-cancel{height:44px;border:none;border-radius:24px;background:var(--bg);color:var(--text);font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;}

/* ── question test overlay (full-screen mini test, launched by tapping any question node) ── */
.test-overlay{display:none;position:absolute;inset:0;z-index:20;background:var(--card);flex-direction:column;}
.test-overlay.open{display:flex;}
.test-head{display:flex;align-items:center;gap:12px;padding:12px 24px 8px;flex-shrink:0;}
.test-close{width:32px;height:32px;border-radius:999px;border:none;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.test-close svg{width:16px;height:16px;color:var(--muted);}
.test-qbar{display:flex;gap:6px;flex:1;}
.test-qnum{flex:1;height:6px;border-radius:4px;background:var(--bg2);}
.test-qnum.current{background:var(--brand);}
.test-qnum.correct{background:var(--success);}
.test-qnum.wrong{background:var(--error);}
.test-body{flex:1;min-height:0;overflow-y:auto;padding:24px;}
.test-question{font-size:18px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:20px;}
.test-answers{display:flex;flex-direction:column;gap:10px;}
.test-answer{
  min-height:56px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--bg2);background:var(--card);
  font-family:inherit;font-size:15px;font-weight:500;color:var(--text);text-align:left;cursor:pointer;
}
.test-answer.chosen{background:var(--bg);border-color:var(--bg2);}
.test-answer.right{background:var(--success-bg);border-color:var(--success);color:var(--success);}
.test-answer.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error);}
.test-hint{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--bg);font-size:13px;color:var(--muted);line-height:1.5;}
.test-foot{padding:12px 24px 28px;flex-shrink:0;}
.test-body.is-result{padding:0;display:flex;flex-direction:column;}

/* ── result screen (pass/fail), matches the reference: purple hero + white sheet ── */
.tr-hero{background:var(--brand-grad);flex-shrink:0;padding:8px 20px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;}
.tr-hero-top{width:100%;display:flex;align-items:center;justify-content:center;position:relative;padding:8px 0 4px;}
.tr-hero-title{font-size:15px;font-weight:700;color:#fff;}
.tr-reset{position:absolute;right:0;top:4px;width:32px;height:32px;border-radius:999px;border:none;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.tr-reset svg{width:16px;height:16px;color:#fff;}
.tr-headline{font-size:21px;font-weight:800;color:#fff;line-height:1.3;margin:14px 0 8px;}
.tr-mascot{width:200px;height:auto;margin-top:4px;}
.tr-sheet{background:var(--card);border-radius:24px 24px 0 0;margin-top:-18px;padding:22px 20px 28px;flex:1;position:relative;}
.tr-sheet-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:16px;}
.tr-row{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:14px;color:var(--text);}
.tr-row-ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.tr-row-ic svg{width:18px;height:18px;}
.tr-row-lbl{flex:1;}
.tr-row-val{font-weight:700;}
.tr-btns{display:flex;gap:8px;margin:18px 0 10px;}
.tr-back{width:44px;height:44px;border-radius:999px;border:none;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.tr-back svg{width:18px;height:18px;color:var(--text);}
.tr-review{flex:1;height:44px;border-radius:999px;border:none;background:var(--bg);color:var(--text);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;}

/* tab bar — Home / Stat / ProDrive / Settings (per app-flow.md) */
.tabbar{background:var(--card);border-top:1px solid var(--bg2);padding:8px 0 20px;display:flex;align-items:center;flex-shrink:0;box-shadow:var(--shadow-top);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 0;}
.tab svg{width:22px;height:22px;}
.tab span{font-size:11px;font-weight:500;}
.tab.on svg,.tab.on span{color:var(--brand);}
.tab:not(.on) svg,.tab:not(.on) span{color:var(--muted);}
</style>
</head>
<body>

<div class="phone" id="phoneEl">
  <div class="scroll" id="homeScroll">
    <div class="sticky-top" id="stickyTop">
      <div class="sbar">
        <div class="time">15:28</div>
        <div class="icons">
          <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1" width="3" height="11" rx="1" opacity=".4"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a16 16 0 0120 0M5.5 12a11 11 0 0113 0M9 15.5a6 6 0 016 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
        </div>
      </div>

      <div class="home-head">
        <div class="coin-pill">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.3H22l-6.2 4.5 2.4 7.2L12 16.5 5.8 21l2.4-7.2L2 9.3h7.6z"/></svg>
          2
        </div>
        <div class="head-icons">
          <button class="circ-btn fav" onclick="openBS('sheetFav')" title="Favorites">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
          </button>
          <button class="circ-btn" title="Streak">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
          </button>
        </div>
      </div>

      <div class="hero-wrap">
        <div class="hero-card" id="heroCard">
          <div class="hero-icon" id="topIcon"></div>
          <div class="tb-lvl" id="topLabel"></div>
          <div class="tb-ttl" id="topTitle"></div>
          <div class="hero-sub" id="topSub"></div>
        </div>
      </div>
    </div>

    <div class="banner-sticky" id="bannerSticky"></div>
    <div class="tabs-sticky" id="tabsSticky"></div>
    <div class="content-panel" id="contentPanel"></div>
  </div>

  <div class="test-overlay" id="testOverlay">
    <div class="sbar">
      <div class="time">15:28</div>
      <div class="icons">
        <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1" width="3" height="11" rx="1" opacity=".4"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a16 16 0 0120 0M5.5 12a11 11 0 0113 0M9 15.5a6 6 0 016 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="test-head" id="testHead">
      <button class="test-close" onclick="closeTestOverlay()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div class="test-qbar" id="testQbar"></div>
    </div>
    <div class="test-body" id="testBody"></div>
    <div class="test-foot" id="testFoot"></div>
  </div>

  <div class="bs-overlay" id="ovMain" onclick="closeAllBS()"></div>

  <div class="bs" id="sheetNode">
    <div class="bs-handle"></div>
    <div class="bs-title" id="nsTitle">Part 02</div>
    <div class="bs-sub" id="nsSub">8 questions</div>
    <div class="bs-btns">
      <button class="btn-full" id="nsStart" onclick="completeCurrentNode()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Start</button>
      <button class="bs-cancel" onclick="closeAllBS()">Cancel</button>
    </div>
  </div>

  <div class="bs" id="sheetSummary">
    <div class="bs-handle"></div>
    <div class="bs-title" id="sumTitle">Topic test</div>
    <div class="bs-sub" id="sumSub"></div>
    <div class="bs-btns" id="sumBtns"></div>
  </div>

  <div class="bs" id="sheetExam">
    <div class="bs-handle"></div>
    <div class="bs-title">Theory test</div>
    <div class="bs-sub">50 questions · pass mark: 43 correct answers, or 86%</div>
    <div class="bs-btns">
      <button class="btn-full"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Start the test</button>
      <button class="bs-cancel" onclick="closeAllBS()">Cancel</button>
    </div>
  </div>

  <div class="bs" id="sheetFav">
    <div class="bs-handle"></div>
    <div class="bs-title">Favorites</div>
    <div class="bs-sub">Signs, articles and questions you've starred</div>
    <div class="bs-btns">
      <button class="bs-cancel" onclick="closeAllBS()">Close</button>
    </div>
  </div>

  <button class="hero-arrow-float left" id="heroPrev" onclick="heroGo(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="hero-arrow-float right" id="heroNext" onclick="heroGo(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>

  <div class="tabbar">
    <div class="tab on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></div>

/* ═══════════ TOPICS — real production category names + question counts (question-bank-structure.md, 785q/18 categories) ═══════════
   Prototype hand-curates 3 of the 18: Alertness (carries the one-time Intro node), Hazard awareness
   (demonstrates the soft-block when a hazard clip scores poorly), Road and traffic signs (largest
   category — proves the even-split algorithm holds up at scale). The rest use the same generic builder. */
const TOPICS=[
  'Alertness','Attitude','Safety and your vehicle','Safety margins','Hazard awareness',
  'Vulnerable road users','Other types of vehicle','Vehicle handling','Motorway rules',
  'Rules of the road','Road and traffic signs','Essential documents','Incidents, accidents and emergencies',
  'Vehicle loading','Other types of vehicle/motorcycle'
];
const QUESTION_COUNTS=[26,38,54,34,78,71,22,29,57,67,134,27,56,20,16];
let curTopic=0; // start on Topic 1 so the new Intro node is visible by default

function computeParts(total,target){
  target=target||8;
  const n=Math.max(2,Math.round(total/target));
  const base=Math.floor(total/n), rem=total-base*n;
  return Array.from({length:n},(_,i)=>base+(i<rem?1:0));
}
function pad(n){ return String(n).padStart(2,'0'); }

// Hazard clips sit close to the end of the topic (just 1-2 question parts before Mistakes/Summary),
// most pronounced on short topics. Mistakes is always the last stop before the topic test.
function trailingPartCount(n){ return n<=3 ? 1 : 2; }

// generic path for the 12 topics we didn't hand-curate: split evenly, all todo, first part current
function buildGenericTopicSteps(total){
  const sizes=computeParts(total);
  const n=sizes.length, split=n-trailingPartCount(n);
  const steps=[];
  for(let i=0;i<split;i++) steps.push({type:'question',label:'Part '+pad(i+1),qCount:sizes[i],state:i===0?'current':'todo'});
  steps.push({type:'hazard',label:'Hazard clip 1',state:'todo'});
  steps.push({type:'hazard',label:'Hazard clip 2',state:'todo'});
  for(let i=split;i<n;i++) steps.push({type:'question',label:'Part '+pad(i+1),qCount:sizes[i],state:'todo'});
  steps.push({type:'mistake',label:'Mistakes',state:'todo'});
  steps.push({type:'summary',label:'Topic test',state:'todo'});
  return steps;
}

const TOPIC_STEPS={};
function getTopicSteps(idx){
  if(TOPIC_STEPS[idx]) return TOPIC_STEPS[idx];
  let steps;
  if(idx===0){
    // Alertness — 26q -> 9/9/8, split=2 (trailing=1). Carries the one-time Intro + hazard-explainer nodes.
    steps=[
      {type:'intro', label:'Introduction', state:'current'},
      {type:'question', label:'Part 01', qCount:9, state:'todo'},
      {type:'question', label:'Part 02', qCount:9, state:'todo'},
      {type:'hazardintro', label:'How hazards work', state:'todo'},
      {type:'hazard', label:'Hazard clip 1', state:'todo'},
      {type:'hazard', label:'Hazard clip 2', state:'todo'},
      {type:'question', label:'Part 03', qCount:8, state:'todo'},
      {type:'mistake', label:'Mistakes', state:'todo'},
      {type:'summary', label:'Topic test', state:'todo'},
    ];
  } else if(idx===4){
    // Hazard awareness — 78q -> 10 parts of ~8, split=8 (trailing=2). Demo: hazard clip 2 scored poorly -> soft-blocks the topic test.
    const sizes=computeParts(78);
    steps=[];
    for(let i=0;i<8;i++) steps.push({type:'question',label:'Part '+pad(i+1),qCount:sizes[i],state:'done'});
    steps.push({type:'hazard', label:'Hazard clip 1', state:'done', pts:5});
    steps.push({type:'hazard', label:'Hazard clip 2', state:'failed', pts:1});
    for(let i=8;i<sizes.length;i++) steps.push({type:'question',label:'Part '+pad(i+1),qCount:sizes[i],state:i===8?'current':'todo'});
    steps.push({type:'mistake', label:'Mistakes', state:'mistake'});
    steps.push({type:'summary', label:'Topic test', state:'todo'});
  } else if(idx===10){
    // Road and traffic signs — 134q -> 17 parts, split=15 (trailing=2). Demonstrates the split algorithm at real scale.
    const sizes=computeParts(134);
    const split=sizes.length-2;
    steps=[];
    for(let i=0;i<split;i++) steps.push({type:'question',label:'Part '+pad(i+1),qCount:sizes[i],state:i===0?'current':'todo'});
    steps.push({type:'hazard',label:'Hazard clip 1',state:'todo'});
    steps.push({type:'hazard',label:'Hazard clip 2',state:'todo'});
    for(let i=split;i<sizes.length;i++) steps.push({type:'question',label:'Part '+pad(i+1),qCount:sizes[i],state:'todo'});
    steps.push({type:'mistake',label:'Mistakes',state:'todo'});
    steps.push({type:'summary',label:'Topic test',state:'todo'});
  } else {
    steps=buildGenericTopicSteps(QUESTION_COUNTS[idx]);
  }
  TOPIC_STEPS[idx]=steps;
  return steps;
}
/* ═══════════ SLIDES (top card) — Intro lives inside the Theory path, not its own slide ═══════════
   The top card replaces the old icon hero card AND the old per-topic banner: it's one sticky,
   swipeable card. On the Theory slide its label/title track whichever topic is scrolled into view
   (see updateTopicLabel()); on Exam/Modes it just shows a static label. */
const SLIDES = [
  {id:'theory', lbl:()=>`Topic ${curTopic+1} of ${TOPICS.length}`, ttl:()=>TOPICS[curTopic]},
  {id:'exam', ttl:()=>'DVSA mock test', sub:'Simulate the real exam', ic:ICONS.trophy, ic_c:'var(--success)'},
  {id:'modes', ttl:()=>'Learning modes', sub:'Extra practice, your way', ic:ICONS.dumbbell, ic_c:'var(--brand2)'},
];
let slideIdx=0;

function renderHero(){
  const s=SLIDES[slideIdx];
  const big=s.id!=='theory';
  document.getElementById('heroCard').classList.toggle('big',big);
  document.getElementById('topLabel').textContent=big?'':s.lbl();
  document.getElementById('topTitle').textContent=s.ttl();
  document.getElementById('topSub').textContent=big?s.sub:'';
  if(big){ document.getElementById('topIcon').innerHTML=s.ic; document.getElementById('topIcon').style.color=s.ic_c; }
  document.getElementById('heroPrev').classList.toggle('hidden',slideIdx===0);
  document.getElementById('heroNext').classList.toggle('hidden',slideIdx===SLIDES.length-1);
  renderPanel(s.id);
}
function updateTopicLabel(){
  if(SLIDES[slideIdx].id!=='theory') return;
  document.getElementById('topLabel').textContent=SLIDES[0].lbl();
  document.getElementById('topTitle').textContent=SLIDES[0].ttl();
}
let slideTransitioning=false;
function heroGo(dir){
  const newIdx=Math.max(0,Math.min(SLIDES.length-1,slideIdx+dir));
  if(newIdx===slideIdx||slideTransitioning) return;
  slideTransitioning=true;
  const panel=document.getElementById('contentPanel');
  const card=document.getElementById('heroCard');
  const outX=dir>0?-22:22, inX=dir>0?22:-22;
  const OUT_MS=170, IN_MS=240;
  [panel,card].forEach(el=>{ el.style.transition=`opacity ${OUT_MS}ms ease, transform ${OUT_MS}ms ease`; el.style.opacity='0'; el.style.transform=`translateX(${outX}px)`; });
  setTimeout(()=>{
    slideIdx=newIdx;
    renderHero();
    [panel,card].forEach(el=>{ el.style.transition='none'; el.style.transform=`translateX(${inX}px)`; });
    panel.offsetHeight;
    requestAnimationFrame(()=>{
      [panel,card].forEach(el=>{ el.style.transition=`opacity ${IN_MS}ms ease, transform ${IN_MS}ms ease`; el.style.opacity='1'; el.style.transform='translateX(0)'; });
      setTimeout(()=>{ slideTransitioning=false; },IN_MS);
    });
  },OUT_MS);
}
let dragX=null, dragging=false;
function initHeroSwipe(){
  const hc=document.getElementById('heroCard');
  hc.addEventListener('pointerdown',e=>{
    dragX=e.clientX; dragging=true;
    try{ hc.setPointerCapture(e.pointerId); }catch(err){}
  });
  hc.addEventListener('pointerup',e=>{
    if(!dragging||dragX===null)return;
    const dx=e.clientX-dragX;
    if(dx>50)heroGo(-1); else if(dx<-50)heroGo(1);
    dragging=false; dragX=null;
  });
  hc.addEventListener('pointercancel',()=>{ dragging=false; dragX=null; });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initHeroSwipe);
else initHeroSwipe();

/* ═══════════ QUESTION TEST SIMULATION — placeholder questions from ExamGB Assets/sample-questions.md,

const QUESTIONS_BY_TOPIC={

const GENERIC_QUESTIONS=[
  {q:'This topic uses placeholder content — a real question would appear here.',a:['Answer A','Answer B','Answer C','Answer D'],correct:0,hint:'Placeholder question for prototyping the test flow.'},
];
function getQuestionsForNode(topicIdx,count){
  const bank=QUESTIONS_BY_TOPIC[TOPICS[topicIdx]]||GENERIC_QUESTIONS;
  return Array.from({length:count},(_,i)=>bank[i%bank.length]);
}

let testState=null;
function startQuestionTest(step,topicIdx){
  testState={
    topicIdx, stepRef:step, idx:0, score:0, answered:false, startedAt:Date.now(),
    questions:getQuestionsForNode(topicIdx, Math.min(5,step.qCount||5)),
  };
  document.getElementById('testHead').style.display='flex';
  document.getElementById('testBody').classList.remove('is-result');
  document.getElementById('testOverlay').classList.add('open');
  renderTestQuestion();
}
function renderTestQuestion(){
  const st=testState;
  document.getElementById('testQbar').innerHTML=st.questions.map((_,i)=>{
    let cls='test-qnum';
    if(i<st.idx) cls+=' '+(st.qResults?.[i]?'correct':'wrong');
    else if(i===st.idx) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('');
  const q=st.questions[st.idx];
  document.getElementById('testBody').innerHTML=`
    <div class="test-question">${q.q}</div>
    <div class="test-answers" id="testAnswers">${q.a.map((opt,i)=>`<button class="test-answer" onclick="chooseTestAnswer(${i})">${opt}</button>`).join('')}</div>
    <div id="testHintWrap"></div>
  `;
  document.getElementById('testFoot').innerHTML=`<button class="btn-full" id="testNextBtn" disabled onclick="nextTestQuestion()">Next</button>`;
  st.answered=false;
}
function chooseTestAnswer(i){
  const st=testState;
  if(st.answered) return;
  st.answered=true;
  const q=st.questions[st.idx];
  const correct=i===q.correct;
  st.qResults=st.qResults||[];
  st.qResults[st.idx]=correct;
  if(correct) st.score++;
  document.querySelectorAll('#testAnswers .test-answer').forEach((btn,bi)=>{
    if(bi===q.correct) btn.classList.add('right');
    else if(bi===i) btn.classList.add('wrong');
  });
  document.getElementById('testHintWrap').innerHTML=`<div class="test-hint">${q.hint}</div>`;
  const nextBtn=document.getElementById('testNextBtn');
  nextBtn.disabled=false;
  nextBtn.textContent=st.idx===st.questions.length-1?'See results':'Next';
}
function nextTestQuestion(){
  const st=testState;
  if(!st.answered) return;
  if(st.idx<st.questions.length-1){ st.idx++; renderTestQuestion(); }
  else finishTest();
}
function fmtTime(ms){
  const s=Math.round(ms/1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function finishTest(){
  const st=testState;
  const total=st.questions.length;
  const passed=st.score/total>=0.6;
  const headline=passed?'Great job!<br>Keep it up!':"Don't give up!<br>You can do it!";
  document.getElementById('testHead').style.display='none';
  document.getElementById('testFoot').innerHTML='';
  const body=document.getElementById('testBody');
  body.classList.add('is-result');
  body.innerHTML=`
    <div class="tr-hero">
      <div class="tr-hero-top">
        <div class="tr-hero-title">Results</div>
        <button class="tr-reset" onclick="retakeTest()">${ICONS.redo}</button>
      </div>
      <div class="tr-headline">${headline}</div>
      <img class="tr-mascot" src="assets/mascot.png" alt="">
    </div>
    <div class="tr-sheet">
      <div class="tr-sheet-title">${st.stepRef.label}</div>
      <div class="tr-row"><span class="tr-row-ic" style="color:var(--warn-star)">★</span><span class="tr-row-lbl">Questions passed</span><span class="tr-row-val">${st.score}/${total}</span></div>
      <div class="tr-row"><span class="tr-row-ic" style="color:var(--brand2)">${ICONS.clock}</span><span class="tr-row-lbl">Total time</span><span class="tr-row-val">${fmtTime(Date.now()-st.startedAt)}</span></div>
      <div class="tr-btns">
        <button class="tr-back" onclick="finishTestBack()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="tr-review" onclick="finishTestBack()">Review answers</button>
      </div>
      <button class="btn-full" onclick="finishTestNext()">Next test</button>
    </div>`;
}
function retakeTest(){
  testState.idx=0; testState.score=0; testState.qResults=[]; testState.startedAt=Date.now();
  document.getElementById('testHead').style.display='flex';
  document.getElementById('testBody').classList.remove('is-result');
  renderTestQuestion();
}
function completeTestedNode(){
  activeNodeCtx={i:null,key:null,topicIdx:testState.topicIdx};
  const src=getStepsForKey(null,testState.topicIdx);
  activeNodeCtx.i=src.indexOf(testState.stepRef);
  completeCurrentNode();
}
function finishTestBack(){
  document.getElementById('testOverlay').classList.remove('open');
  completeTestedNode();
}
function finishTestNext(){
  const topicIdx=testState.topicIdx;
  completeTestedNode();
  const src=getStepsForKey(null,topicIdx);
  const next=src.find(s=>s.state==='current');
  if(next && next.type==='question'){
    startQuestionTest(next,topicIdx); // chain straight into the next question circle
  } else {
    document.getElementById('testOverlay').classList.remove('open');
  }
}
function closeTestOverlay(){
  document.getElementById('testOverlay').classList.remove('open');
  testState=null;
}

/* ═══════════ LEARNING MODES ═══════════ */
const MODES=[
  {id:'adaptive', ttl:'Adaptive mode', sub:'Adapts to what you know', ic:ICONS.adaptive, path:true},
  {id:'hazardfull', ttl:'Hazard perception', sub:'All 14 clips, practice anytime', ic:ICONS.car, path:false},
  {id:'signs', ttl:'Road signs quiz', sub:'Practice by category', ic:ICONS.sign, path:true},
  {id:'video', ttl:'Video questions', sub:'No time or mistakes limits', ic:ICONS.video, path:false},
  {id:'battle', ttl:'Quiz battle', sub:'Compete in real time', ic:ICONS.battle, path:false},
  {id:'marathon', ttl:'Marathon', sub:'All questions, no limits', ic:ICONS.marathon, path:false},
];
let modesSub=null;

const SIGN_STEPS=[
  {type:'question', label:'Warning signs', state:'done'},
  {type:'mistake', label:'Mistakes', state:'mistake'},
  {type:'question', label:'Regulatory signs', state:'current'},
  {type:'question', label:'Information signs', state:'todo'},
  {type:'question', label:'Direction signs', state:'todo'},
];
const ADAPTIVE_STEPS=[
  {type:'question', label:'Question 1', state:'done'},
  {type:'question', label:'Question 2', state:'current'},
  {type:'question', label:'Question 3', state:'todo'},
  {type:'question', label:'Question 4', state:'todo'},
];
function getStepsForKey(key,topicIdx){
  if(key==='signs') return SIGN_STEPS;
  if(key==='adaptive') return ADAPTIVE_STEPS;
  return getTopicSteps(topicIdx!=null?topicIdx:curTopic);
}
function iconForStep(s){
  if(s.type==='hazard') return ICONS.car;
  if(s.type==='mistake') return ICONS.redo;
  if(s.type==='summary') return ICONS.trophy;
  if(s.type==='intro'||s.type==='hazardintro') return s.type==='intro'?ICONS.book:ICONS.info;
  return ICONS.qmark;
}

/* ═══════════ PATH RENDERER — every node is a circle; only the icon differs by type ═══════════
   yOffset lets multiple topics' paths stack into one continuous scroll (see renderAllTopicsPath). */
function renderPath(steps, opts){
  opts=opts||{};
  const width=310, gapY=88, centerX=width/2, yOffset=opts.yOffset||0;
  const offs=[0,54,0,-54];
  const pos=steps.map((s,i)=>({x:centerX+offs[i%offs.length], y:i*gapY+40+yOffset}));
  const height=(steps.length-1)*gapY+80;
  let lines='';
  for(let i=1;i<pos.length;i++){
    lines+=`<line x1="${pos[i-1].x}" y1="${pos[i-1].y}" x2="${pos[i].x}" y2="${pos[i].y}" stroke="#E4E1EC" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round"/>`;
  }
  let nodes='';
  steps.forEach((s,i)=>{
    const cls='pnode '+s.state;
    const inner = s.state==='done' ? ICONS.check : iconForStep(s);
    const capCls = s.state==='todo' ? 'pcap dim' : 'pcap';
    const marker = (i===0 && opts.topicIdx!=null) ? ` data-topic-marker="${opts.topicIdx}"` : '';
    const btn = s.state==='todo' ? '' : `onclick="nodeTap(${i},'${opts.key||''}',${opts.topicIdx!=null?opts.topicIdx:'null'})"`;
    nodes+=`<div class="pnode-wrap" style="left:${pos[i].x}px;top:${pos[i].y}px;"${marker}>
      <button class="${cls}" ${btn}><span class="pnode-inner">${inner}</span></button>
      <div class="${capCls}">${s.label}</div>
    </div>`;
  });
  return {html:`<svg width="${width}" height="${height+yOffset}" style="position:absolute;top:0;left:0;pointer-events:none;">${lines}</svg>${nodes}`, height:height+yOffset};
}

let activeNodeCtx=null;
function nodeTap(i,key,topicIdx){
  const src=getStepsForKey(key,topicIdx);
  const step=src[i];
  if(step.state==='todo') return;
  activeNodeCtx={i,key,topicIdx};
  if(step.type==='question'){ startQuestionTest(step,topicIdx); return; }
  if(step.type==='summary'){ openSummarySheet(src); return; }
  document.getElementById('nsTitle').textContent=step.label;
  let sub;
  if(step.type==='intro') sub='Two parts: theory and hazard perception. Follow the path to prepare for both.';
  else if(step.type==='hazardintro') sub='A hazard clip is a short video — tap as soon as you spot a developing hazard. Early, well-timed taps score higher.';
  else if(step.type==='hazard') sub = step.state==='done' ? `Completed — ${step.pts||5} points` : step.state==='failed' ? `Scored low — ${step.pts||1} points, try again` : '1 hazard perception clip';
  else sub = step.state==='done' ? 'Reviewed' : 'Questions you got wrong';
  document.getElementById('nsSub').textContent=sub;
  document.getElementById('nsStart').innerHTML = (step.state==='done' ? '' : ICONS.play) + (step.state==='done'?'Review': (step.type==='intro'||step.type==='hazardintro')?'Got it':'Start');
  openBS('sheetNode');
}
function completeCurrentNode(){
  if(!activeNodeCtx) return closeAllBS();
  const src=getStepsForKey(activeNodeCtx.key,activeNodeCtx.topicIdx);
  const i=activeNodeCtx.i;
  if(['current','mistake','failed'].includes(src[i].state)){
    src[i].state='done';
    const next=src.find(s=>s.state==='todo');
    if(next) next.state='current';
  }
  closeAllBS();
  if(SLIDES[slideIdx].id==='theory') renderPanel('theory'); else renderHero();
}

/* ═══════════ TOPIC SUMMARY / MINI-EXAM — soft-blocks if a hazard clip in this topic scored poorly ═══════════ */
function openSummarySheet(src){
  const hazardFail=src.find(s=>s.type==='hazard'&&s.state==='failed');
  const title=document.getElementById('sumTitle');
  const sub=document.getElementById('sumSub');
  const btns=document.getElementById('sumBtns');
  if(hazardFail){
    title.textContent='Hazard perception needs work';
    sub.textContent='Your last hazard clip scored low. We recommend redoing it before the topic test.';
    btns.innerHTML=`<button class="btn-full" onclick="redoHazard()">Redo hazard</button><button class="bs-cancel" onclick="startSummaryAnyway()">Start test anyway</button>`;
  } else {
    title.textContent='Topic test';
    sub.textContent='A quick check before moving on to the next topic.';
    btns.innerHTML=`<button class="btn-full" onclick="startSummaryAnyway()">${ICONS.play}Start the test</button><button class="bs-cancel" onclick="closeAllBS()">Cancel</button>`;
  }
  openBS('sheetSummary');
}
function redoHazard(){
  const src=getStepsForKey(activeNodeCtx.key,activeNodeCtx.topicIdx);
  const hz=src.find(s=>s.type==='hazard'&&s.state==='failed');
  if(hz) hz.state='current';
  closeAllBS();
  if(SLIDES[slideIdx].id==='theory') renderPanel('theory'); else renderHero();
}
function startSummaryAnyway(){
  completeCurrentNode();
}

/* ═══════════ CONTENT PANEL ═══════════ */
function renderPanel(id){
  const el=document.getElementById('contentPanel');
  const bs=document.getElementById('bannerSticky');
  const ts=document.getElementById('tabsSticky');
  const stickyH=document.getElementById('stickyTop').offsetHeight+'px';
  bs.style.display='none'; ts.style.display='none';

  if(id==='theory'){
    el.innerHTML=panelTheory();
    initTopicScrollTracking();
  } else if(id==='modes' && modesSub==='hazardfull'){
    bs.style.display='block'; bs.style.top=stickyH;
    bs.innerHTML=`<div class="lm-back" onclick="modesSub=null;renderPanel('modes')">${backChevSvg()}<span>Learning modes</span></div>`;
    ts.style.display='block'; ts.style.top=(document.getElementById('bannerSticky').offsetHeight+document.getElementById('stickyTop').offsetHeight)+'px';
    ts.innerHTML=hazardTabsHTML();
    el.innerHTML=panelHazard();
  } else if(id==='modes' && modesSub){
    const m=MODES.find(x=>x.id===modesSub);
    bs.style.display='block'; bs.style.top=stickyH;
    bs.innerHTML=`<div class="lm-back" onclick="modesSub=null;renderPanel('modes')">${backChevSvg()}<span>Learning modes</span></div>
      <div class="topic-banner" style="border-color:var(--brand2);">
        <div class="tb-lvl" style="color:var(--brand2);">${m.ttl}</div>
        <div class="tb-ttl">${m.sub}</div>
      </div>`;
    el.innerHTML=panelModes();
  } else if(id==='exam'){
    el.innerHTML=panelExam();
  } else if(id==='modes'){
    el.innerHTML=panelModes();
  }
}

/* Single continuous path across all 15 topics — topics are not separate "pages", the sticky
   top card just relabels itself as the matching topic scrolls under it (see initTopicScrollTracking). */
function panelTheory(){
  let y=0, nodesHtml='', linesHtml='';
  const width=310;
  TOPICS.forEach((_,idx)=>{
    const steps=getTopicSteps(idx);
    const r=renderPath(steps,{topicIdx:idx,yOffset:y});
    nodesHtml+=r.html;
    y=r.height+40; // gap before next topic's path continues
  });
  return `<div class="path-box" style="width:${width}px;height:${y}px;">${nodesHtml}</div>`;
}

let topicMarkerYs=[];
function initTopicScrollTracking(){
  const scrollEl=document.getElementById('homeScroll');
  const stickyH=document.getElementById('stickyTop').offsetHeight;
  topicMarkerYs=Array.from(document.querySelectorAll('[data-topic-marker]')).map(el=>({
    idx:parseInt(el.dataset.topicMarker,10),
    top:el.getBoundingClientRect().top+scrollEl.scrollTop-scrollEl.getBoundingClientRect().top
  }));
  let ticking=false;
  scrollEl.onscroll=()=>{
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(()=>{
      const threshold=scrollEl.scrollTop+stickyH+20;
      let active=topicMarkerYs[0];
      for(const m of topicMarkerYs){ if(m.top<=threshold) active=m; else break; }
      if(active && active.idx!==curTopic){ curTopic=active.idx; updateTopicLabel(); }
      ticking=false;
    });
  };
}

function hazardTabsHTML(){
  return `<div class="pill-tabs">${['all','todo','failed','done'].map(t=>{
    const lbl=t==='all'?'All':t==='todo'?'To do':t==='failed'?'Failed':'Mastered';
    return `<button class="pill-tab ${hazardTab===t?'active':''}" onclick="hazardTab='${t}';renderPanel('modes')">${lbl}</button>`;
  }).join('')}</div>`;
}
function panelHazard(){
  const filtered=HAZARD_CLIPS.filter(c=>{
    if(hazardTab==='all') return true;
    if(hazardTab==='todo') return c.status==='todo'||c.status==='current';
    if(hazardTab==='failed') return c.status==='failed';
    return c.status==='done';
  });
  const cards=filtered.map(c=>{
    const cur = c.status==='current'?'current':'';
    const badge = c.status==='done'?'var(--success)':c.status==='failed'?'var(--error)':'transparent';
    let statusHtml;
    if(c.status==='done') statusHtml=`<span class="hz-dot" style="background:var(--success);"></span>${c.pts} points`;
    else if(c.status==='failed') statusHtml=`<span class="hz-dot" style="background:var(--error);"></span>${c.pts} points`;
    else statusHtml=`Start`;
    const statusCls = (c.status==='done'||c.status==='failed') ? '' : 'start';
    return `<div class="hz-card ${cur}">
      <div class="hz-thumb"><img src="https://picsum.photos/seed/hazard${c.n}/200/150" alt=""><span class="hz-badge" style="background:${badge};"></span></div>
      <div class="hz-foot"><span class="hz-num">${c.n}</span><span class="hz-status ${statusCls}">${statusHtml}</span></div>
    </div>`;
  }).join('');
  return `<div class="hz-grid">${cards||'<div class="plain-hint">Nothing here yet</div>'}</div>`;
}

function panelExam(){
  const last=46,total=50,pass=43;
  const pct=Math.round(last/total*100);
  return `
    <div class="stat-row">
      <div class="stat-box"><div class="v">${last}/${total}</div><div class="l">Last result</div></div>
      <div class="stat-box"><div class="v">41/50</div><div class="l">Best result</div></div>
      <div class="stat-box"><div class="v">4</div><div class="l">Test taken</div></div>
    </div>
    <div class="pass-lbl">Pass mark: ${pass} correct answers, or 86%</div>
    <div class="pass-bar"><div class="pass-bar-fill" style="width:${pct}%"></div></div>
    <button class="btn-full" onclick="openBS('sheetExam')">${ICONS.play}Start mock test</button>
    <div class="plain-hint">No instant feedback — just like the real exam.</div>
  `;
}

function wrapPath(result){
  return `<div class="path-box" style="width:310px;height:${result.height}px;">${result.html}</div>`;
}
function panelModes(){
  if(modesSub){
    const steps = modesSub==='signs'?SIGN_STEPS:ADAPTIVE_STEPS;
    return wrapPath(renderPath(steps,{key:modesSub}));
  }
  return MODES.map(m=>`
    <div class="lm-row" onclick="${(m.path||m.id==='hazardfull')?`modesSub='${m.id}';renderPanel('modes')`:''}">
      <div class="lm-ico">${m.ic}</div>
      <div class="lm-txt"><div class="lm-ttl">${m.ttl}</div><div class="lm-sub">${m.sub}</div></div>
      <div class="lm-start">${ICONS.chevRight}</div>
    </div>
  `).join('');
}

/* ═══════════ BOTTOM SHEETS ═══════════ */
function openBS(id){
  document.querySelectorAll('.bs').forEach(b=>{b.style.display='none';b.classList.remove('open');});
  const sheet=document.getElementById(id);
  const ov=document.getElementById('ovMain');
  sheet.style.display='block'; ov.style.display='block';
  requestAnimationFrame(()=>{ sheet.classList.add('open'); ov.classList.add('vis'); });
}
function closeAllBS(){
  document.querySelectorAll('.bs').forEach(b=>b.classList.remove('open'));
  document.getElementById('ovMain').classList.remove('vis');
  setTimeout(()=>{ document.querySelectorAll('.bs').forEach(b=>b.style.display='none'); document.getElementById('ovMain').style.display='none'; },380);
}

renderHero();
setTimeout(()=>{
  const hc=document.getElementById('heroCard');
  hc.classList.add('hint');
  hc.addEventListener('animationend',()=>hc.classList.remove('hint'),{once:true});
},1400);
</script>
