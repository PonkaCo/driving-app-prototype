<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Exam — readiness mockup (ref-styled)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --brand:#401971;--brand2:#6B2ABC;--accent:#FA5732;
  --bg:#F2F0F5;--bg2:#E9E7EB;--card:#FCFCFC;--tint:#F0EAF8;
  --text:#150826;--muted:#797282;--on-brand:#FFFCFC;
  --success:#00A850;--success-bg:#D4FCE7;
  --warn-star:#FAC32A;
  --shadow:0px 6px 30px 0px rgba(55,22,97,0.08);
  --shadow-top:0px -2px 24px 0px rgba(55,21,97,0.04);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
body{background:#1A1230;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.phone{
  width:390px;height:844px;border-radius:50px;overflow:hidden;flex-shrink:0;position:relative;
  box-shadow:0 0 0 10px #1A1A2E,0 0 0 12px #2E2E50,0 48px 100px rgba(0,0,0,.6);
  display:flex;flex-direction:column;background:var(--card);
}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{display:none;}

.sbar{height:46px;padding:14px 22px 0;display:flex;align-items:center;justify-content:space-between;}
.sbar .time{font-size:15px;font-weight:600;color:var(--text);}
.sbar .icons{display:flex;align-items:center;gap:5px;color:var(--text);}
.sbar .icons svg{width:16px;height:16px;}

.ex-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 4px;}
.circ-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--bg2);background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex-shrink:0;}
.circ-btn svg{width:17px;height:17px;color:var(--muted);}
.circ-btn.fav svg{color:var(--warn-star);}
.ex-head-title{font-size:20px;font-weight:600;color:var(--text);}

.content-panel{padding:18px 20px 32px;}

/* exam date — plain, low-color, small Edit button instead of a days-left counter */
.ex-date-card{background:var(--card);border:1px solid var(--bg2);border-radius:18px;padding:14px 16px;margin-bottom:24px;display:flex;align-items:center;gap:12px;}
.ex-date-ico{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-date-ico svg{width:19px;height:19px;color:var(--muted);}
.ex-date-txt{flex:1;min-width:0;}
.ex-date-lbl{font-size:12px;font-weight:500;color:var(--muted);}
.ex-date-val{font-size:15px;font-weight:600;color:var(--text);margin-top:1px;}
.ex-date-edit{flex-shrink:0;height:32px;padding:0 14px;border-radius:999px;border:none;background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}

/* Theory / Hazards — back to boxed cards, icon only (no "Theory"/"Hazards" label), pass mark as text */
.ex-split{display:flex;gap:10px;margin-top:16px;}
.ex-split-card{flex:1;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);}
.ex-split-head{margin-bottom:10px;}
.ex-split-head svg{width:16px;height:16px;color:var(--brand2);}
.ex-split-score{font-size:20px;font-weight:600;color:var(--text);}
.ex-split-score .of{font-size:13px;font-weight:500;color:var(--muted);}
.ex-split-bar{height:5px;border-radius:4px;background:var(--bg2);margin-top:8px;overflow:hidden;}
.ex-split-fill{height:100%;border-radius:4px;}
.ex-split-fill.theory{background:var(--brand2);}
.ex-split-fill.hazard{background:var(--accent);}
.ex-split-sub{font-size:11px;color:var(--muted);margin-top:6px;}

/* Test simulator — photo hero card, ref-inspired: image fading into a dark scrim, CTA inside */
.ex-summary-card{position:relative;border-radius:24px;overflow:hidden;text-align:center;background:#2A0F52;}
.ex-summary-photo{width:100%;aspect-ratio:16/11;object-fit:cover;display:block;}
.ex-summary-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(42,15,82,.1) 0%, rgba(42,15,82,.6) 42%, #2A0F52 76%, #2A0F52 100%);}
.ex-summary-content{position:relative;padding:0 20px 22px;margin-top:-44px;}
.ex-summary-ico{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.ex-summary-ico svg{width:23px;height:23px;color:#fff;}
.ex-summary-eyebrow{font-size:12px;font-weight:600;color:#CFBBE2;}
.ex-summary-ttl{font-size:19px;font-weight:600;color:#fff;margin-top:2px;}
.ex-summary-info{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;}
.ex-summary-info-chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:rgba(255,255,255,.72);}
.ex-summary-info-chip svg{width:14px;height:14px;}
.ex-summary-row{display:flex;align-items:center;gap:10px;margin-top:16px;}
.ex-summary-bar{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;}
.ex-summary-fill{height:100%;border-radius:4px;background:var(--accent);}
.ex-summary-val{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;}
.ex-summary-cta{width:100%;height:46px;border:none;border-radius:24px;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;}
.ex-summary-proof{margin-top:10px;font-size:12px;color:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;gap:5px;}
.ex-summary-proof svg{width:13px;height:13px;}

/* Practice by topic — relocated to the very bottom, low-emphasis row */
.ex-bottom-link{width:100%;margin-top:22px;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--brand2);cursor:pointer;padding:10px 0;}
.ex-bottom-link svg{width:16px;height:16px;}

.tabbar{background:var(--card);border-top:1px solid var(--bg2);padding:8px 0 20px;display:flex;align-items:center;flex-shrink:0;box-shadow:var(--shadow-top);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;}
.tab svg{width:22px;height:22px;}
.tab span{font-size:11px;font-weight:500;}
.tab.on svg,.tab.on span{color:var(--brand);}
.tab:not(.on) svg,.tab:not(.on) span{color:var(--muted);}
</style>
</head>
<body>

<div class="phone">
  <div class="scroll">
    <div class="sbar">
      <div class="time">15:28</div>
      <div class="icons">
        <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1" width="3" height="11" rx="1" opacity=".4"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a16 16 0 0120 0M5.5 12a11 11 0 0113 0M9 15.5a6 6 0 016 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="ex-head">

        </div>
        <button class="ex-date-edit">Edit</button>
      </div>

      <div class="ex-summary-card">

        <div class="ex-summary-content">
          <div class="ex-summary-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 4H3v2a4 4 0 004 4M17 4h4v2a4 4 0 01-4 4"/></svg></div>
          <div class="ex-summary-eyebrow">Theory and hazards</div>
          <div class="ex-summary-ttl">Test simulator</div>
          <div class="ex-summary-info">
            <span class="ex-summary-info-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>50 Q + 14 clips</span>
            <span class="ex-summary-info-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>77 min</span>
          </div>
          <div class="ex-summary-row">
            <div class="ex-summary-bar"><div class="ex-summary-fill" style="width:61%"></div></div>
            <span class="ex-summary-val">46/75</span>
          </div>
          <button class="ex-summary-cta">Start mock test</button>
          <div class="ex-summary-proof"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>4,257 people started this week</div>
        </div>
      </div>

      <div class="ex-split">
        <div class="ex-split-card">
          <div class="ex-split-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></div>
          <div class="ex-split-score">42<span class="of">/50</span></div>
          <div class="ex-split-bar"><div class="ex-split-fill theory" style="width:84%"></div></div>
          <div class="ex-split-sub">Pass mark: 43/50</div>
        </div>
        <div class="ex-split-card">
          <div class="ex-split-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L14.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>

          <div class="ex-split-bar"><div class="ex-split-fill hazard" style="width:49%"></div></div>
          <div class="ex-split-sub">Pass mark: 44/75</div>
        </div>
      </div>

      <button class="ex-bottom-link">Practice by topic instead<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Learn</span></div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M4 8l4-4 2 2-4 4-2-2zM14 18l4-4 2 2-4 4-2-2zM2 10l2-2M20 16l2-2M9 6l3-3M15 18l3-3"/></svg><span>Practice</span></div>
    <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 4H3v2a4 4 0 004 4M17 4h4v2a4 4 0 01-4 4"/></svg><span>Test</span></div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg><span>ProDrive</span></div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.6-.22l-2.39.96a6.96 6.96 0 00-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 00-.6.22L2.74 8.87a.48.48 0 00.12.6l2.03 1.58c-.05.3-.07.63-.07.95s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.6.22l2.39-.96c.5.37 1.04.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.23.07.48 0 .6-.22l1.92-3.32a.49.49 0 00-.12-.61l-2.02-1.58zM12 15.6a3.6 3.6 0 110-7.2 3.6 3.6 0 010 7.2z"/></svg><span>Settings</span></div>

</body>
