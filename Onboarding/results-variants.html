<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Results — 2 variants</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --brand:#401971;--brand2:#6B2ABC;--accent:#FA5732;
  --bg:#F2F0F5;--bg2:#E9E7EB;--card:#FCFCFC;
  --text:#150826;--muted:#797282;
  --success:#00A850;--success-muted:#D4FCE7;
  --error:#FF2346;--error-muted:#FFE0E5;
  --shadow:0px 6px 30px 0px rgba(55,22,97,0.08);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
body{
  background:#1E1535;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  gap:40px;padding:40px 24px;flex-wrap:wrap;
}

/* Label above phones */
.variant-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
.variant-lbl{
  font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:rgba(255,255,255,.45);
}

/* Phone shell */
.phone{
  width:390px;height:844px;
  border-radius:50px;overflow:hidden;flex-shrink:0;position:relative;
  box-shadow:0 0 0 10px #1A1A2E,0 0 0 12px #2E2E50,0 48px 100px rgba(0,0,0,.6);
}

/* ── Page base ── */
.page{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;}

/* ═══════════════════════════
   SHARED RESULTS STYLES
═══════════════════════════ */
.res-bg{
  background:linear-gradient(160deg,#3A1068 0%,#5B22A0 100%);
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}

/* Status bar */
.sbar-r{
  height:50px;padding:0 20px;
  display:flex;align-items:center;flex-shrink:0;position:relative;
}
.sbar-signal{display:flex;align-items:center;gap:3px;color:#fff;}
.sbar-signal svg{width:16px;height:16px;}
.sbar-signal span{font-size:13px;font-weight:500;color:#fff;margin-right:2px;}
.sbar-time{font-size:15px;font-weight:700;color:#fff;position:absolute;left:50%;transform:translateX(-50%);}
.sbar-batt{display:flex;align-items:center;gap:5px;color:#fff;margin-left:auto;}
.sbar-batt svg{width:16px;height:16px;}

/* Top area (title + character) */
.res-top{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding:0 24px 0;position:relative;overflow:hidden;
}
.res-title{
  font-size:26px;font-weight:800;color:#fff;text-align:center;line-height:1.2;
  margin-bottom:16px;
}
.res-char{width:220px;flex-shrink:0;display:block;}

/* Bottom sheet */
.res-sheet{
  background:#fff;border-radius:28px 28px 0 0;flex-shrink:0;
  padding:24px 20px 0;
}
.res-sheet-ttl{font-size:20px;font-weight:800;color:var(--text);margin-bottom:16px;}
.res-stat-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 0;
}
.res-stat-row+.res-stat-row{border-top:1px solid var(--bg);}
.res-stat-left{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:var(--text);}
.res-stat-left svg{width:20px;height:20px;flex-shrink:0;}
.res-stat-val{font-size:16px;font-weight:700;color:var(--text);}
.res-divider{height:1px;background:var(--bg);margin:4px 0 20px;}

/* Buttons */
.btn-next{
  width:100%;height:54px;background:var(--accent);border:none;border-radius:30px;
  font-family:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:filter .15s;
}
.btn-next:active{filter:brightness(.92);}


/* Share button top-right */
.res-top-bar{
  display:flex;align-items:center;justify-content:flex-end;
  padding:6px 20px 0;flex-shrink:0;
}
.res-share-btn{
  width:34px;height:34px;background:rgba(255,255,255,.15);border:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.res-share-btn svg{width:18px;height:18px;color:#fff;}

/* ═══════════════════════════
   VARIANT A
   Два вторичных действия рядом в одном ряду + большая основная снизу
═══════════════════════════ */
.va-actions{display:flex;flex-direction:column;gap:10px;padding-bottom:36px;}
.va-row{display:flex;gap:10px;}
/* Иконка-кнопка (только иконка, квадратная) */
.btn-icon-sq{
  width:54px;height:54px;flex-shrink:0;background:var(--bg);border:none;border-radius:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:filter .15s;
}
.btn-icon-sq:active{filter:brightness(.95);}
.btn-icon-sq svg{width:20px;height:20px;color:var(--muted);}
/* Широкая вторичная кнопка */
.btn-secondary-wide{
  flex:1;height:54px;background:var(--bg);border:none;border-radius:18px;
  font-family:inherit;font-size:16px;font-weight:600;color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s;
}
.btn-secondary-wide:active{filter:brightness(.95);}
.btn-secondary-wide svg{width:18px;height:18px;color:var(--muted);}

/* ═══════════════════════════
   VARIANT B
   Next test + Review answers рядом, "Back to topics" — тихая ссылка снизу
═══════════════════════════ */
.vb-sheet{
  background:#fff;border-radius:28px 28px 0 0;flex-shrink:0;
  padding:24px 20px 0;
}
.vb-main-row{display:flex;gap:10px;margin-bottom:10px;}
/* Иконка-кнопка круглая (Review) */
.btn-icon-round{
  width:54px;height:54px;flex-shrink:0;background:var(--bg);border:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:filter .15s;
}
.btn-icon-round:active{filter:brightness(.95);}
.btn-icon-round svg{width:20px;height:20px;color:var(--muted);}
/* Основная кнопка во всю оставшуюся ширину */
.btn-next-flex{
  flex:1;height:54px;background:var(--accent);border:none;border-radius:30px;
  font-family:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:filter .15s;
}
.btn-next-flex:active{filter:brightness(.92);}
/* Тихая ссылка */
.vb-back-link{
  width:100%;height:48px;background:transparent;border:none;
  font-family:inherit;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:color .15s;
}
.vb-back-link:active{color:var(--brand);}
.vb-back-link svg{width:15px;height:15px;}
.vb-safe{height:20px;background:#fff;flex-shrink:0;}

/* Header bar shared */
.vb-header{
  display:flex;align-items:center;padding:6px 20px 0;flex-shrink:0;position:relative;
}
.vb-share{
  width:34px;height:34px;background:rgba(255,255,255,.15);border:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:auto;
}
.vb-share svg{width:18px;height:18px;color:#fff;}

/* Confetti dots decoration */
.confetti{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;}
.cdot{position:absolute;border-radius:50%;opacity:.55;}
</style>
</head>
<body>

<!-- ══════════════════════
     VARIANT A
══════════════════════ -->
<div class="variant-wrap">
  <div class="variant-lbl">Вариант A — кнопка назад</div>
  <div class="phone">
    <div class="page">
      <div class="res-bg">

        <!-- Status bar -->
        <div class="sbar-r">
          <div class="sbar-signal">

            <span>Carrier</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
          </div>
          <span class="sbar-time">9:41 AM</span>
          <div class="sbar-batt">

        </div>

        <!-- Share button -->

          </div>
        </div>

        <!-- Title + character -->

          <div class="confetti">
            <div class="cdot" style="width:10px;height:10px;background:#FA5732;top:18%;left:12%;transform:rotate(20deg);border-radius:2px;"></div>

          <!-- Mascot character -->

            <!-- Shadow -->

            <!-- Purple hoodie -->

            <!-- Head -->
            <circle cx="110" cy="108" r="50" fill="#D4894A"/>
            <!-- Ears -->
            <circle cx="66" cy="72" r="17" fill="#D4894A"/>
            <circle cx="154" cy="72" r="17" fill="#D4894A"/>
            <circle cx="66" cy="72" r="9" fill="#F0A870"/>
            <circle cx="154" cy="72" r="9" fill="#F0A870"/>
            <!-- Spots -->
            <circle cx="88" cy="82" r="6" fill="rgba(0,0,0,0.11)"/>
            <circle cx="128" cy="76" r="5" fill="rgba(0,0,0,0.11)"/>
            <circle cx="98" cy="66" r="3.5" fill="rgba(0,0,0,0.09)"/>
            <circle cx="122" cy="96" r="4" fill="rgba(0,0,0,0.09)"/>
            <!-- Muzzle -->
            <ellipse cx="110" cy="124" rx="20" ry="13" fill="#F0A870"/>
            <!-- Happy eyes -->
            <path d="M96 100 Q100 94 104 100" stroke="#1A0A2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M116 100 Q120 94 124 100" stroke="#1A0A2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <!-- Happy eyebrows -->
            <path d="M89 90 Q96 86 102 90" stroke="#8B4513" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M118 90 Q124 86 131 90" stroke="#8B4513" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- Big smile -->
            <path d="M96 128 Q110 138 124 128" stroke="#8B4513" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- Fist raised right -->
            <path d="M152 130 Q166 112 170 96" stroke="#C17B3A" stroke-width="16" fill="none" stroke-linecap="round"/>
            <path d="M154 128 Q166 112 168 98" stroke="#5B2AB0" stroke-width="11" fill="none" stroke-linecap="round"/>
            <rect x="158" y="76" width="22" height="28" rx="6" fill="#D4894A"/>
            <line x1="162" y1="82" x2="176" y2="82" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
            <line x1="162" y1="86" x2="176" y2="86" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
            <!-- Left arm relaxed -->
            <path d="M64 142 Q50 158 54 174" stroke="#C17B3A" stroke-width="14" fill="none" stroke-linecap="round"/>
            <path d="M66 140 Q54 154 56 168" stroke="#5B2AB0" stroke-width="10" fill="none" stroke-linecap="round"/>
            <circle cx="54" cy="176" r="9" fill="#D4894A"/>
          </svg>
        </div>

        <!-- Bottom sheet -->
        <div class="res-sheet">
          <div class="res-sheet-ttl">Test #1</div>
          <div class="res-stat-row">
            <div class="res-stat-left">
              <svg viewBox="0 0 24 24" fill="#FAC32A"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              Questions passed
            </div>
            <span class="res-stat-val">20 / 20</span>
          </div>
          <div class="res-stat-row">
            <div class="res-stat-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Total time
            </div>
            <span class="res-stat-val">10:45</span>
          </div>
          <div class="res-divider"></div>
          <div class="va-actions">
            <!-- Вторичные действия одним рядом -->
            <div class="va-row">
              <button class="btn-icon-sq" title="Back to topics">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <button class="btn-secondary-wide">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
                Review answers
              </button>
            </div>
            <!-- Основное действие -->
            <button class="btn-next">Next test</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

     VARIANT B
══════════════════════ -->

          </div>

            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="18" height="11" rx="2"/><path d="M22 11v3" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>
          </div>
        </div>

        <!-- Header with share -->
        <div class="vb-header" style="position:relative;display:flex;padding:6px 20px 0;">
          <div style="width:34px"></div>

            <circle cx="66" cy="72" r="9" fill="#F0A870"/>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back to topics

      </div>
    </div>
  </div>
</div>

</body>
</html>
